<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How Anchor works: the Anchor app on your computer hides apps on your phone over a USB cable, and only that computer can bring them back</title>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="959" height="419" rx="20" fill="#0D0A14" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- ===== Laptop running Anchor ===== -->
  <rect x="96" y="58" width="300" height="196" rx="12" fill="#1E1829" stroke="#3A3150"/>
  <rect x="106" y="68" width="280" height="176" rx="6" fill="#0D0A14"/>
  <!-- the Anchor window -->
  <text x="246" y="88" fill="#EEEAF7" font-size="10" font-weight="800" text-anchor="middle">Anchor</text>
  <rect x="118" y="98" width="256" height="34" rx="9" fill="#221934" stroke="#8B5CF6" stroke-opacity="0.35"/>
  <circle cx="134" cy="115" r="8" fill="#7C3AED"/>
  <g transform="translate(129 110) scale(0.42)"><path fill="#FFFFFF" d="M12,2A3,3 0 0,0 9,5C9,6.27 9.8,7.4 11,7.83V10H8V12H11V18.92C9.16,18.63 7.53,17.57 6.53,16H8V14H3V19H5V17.3C6.58,19.61 9.2,21 12,21C14.8,21 17.42,19.61 19,17.3V19H21V14H16V16H17.46C16.46,17.56 14.83,18.63 13,18.92V12H16V10H13V7.82C14.2,7.4 15,6.27 15,5A3,3 0 0,0 12,2M12,4A1,1 0 0,1 13,5A1,1 0 0,1 12,6A1,1 0 0,1 11,5A1,1 0 0,1 12,4Z"/></g>
  <text x="148" y="113" fill="#EEEAF7" font-size="9" font-weight="800">Anchored</text>
  <text x="148" y="125" fill="#EEEAF7" fill-opacity="0.55" font-size="7">2 apps hidden from your phone</text>
  <rect x="318" y="107" width="48" height="16" rx="8" fill="none" stroke="#A78BFA"/>
  <text x="342" y="118" fill="#E4DBFF" font-size="7" font-weight="800" text-anchor="middle">Release all</text>

  <rect x="118" y="140" width="256" height="94" rx="9" fill="#16121F"/>
  <g font-size="8">
    <rect x="128" y="149" width="16" height="16" rx="5" fill="#E1306C"/>
    <text x="152" y="160" fill="#EEEAF7">Instagram</text>
    <rect x="320" y="150" width="44" height="14" rx="7" fill="none" stroke="#A78BFA"/>
    <text x="342" y="160" fill="#E4DBFF" font-size="7" font-weight="800" text-anchor="middle">Release</text>
    <line x1="128" y1="172" x2="364" y2="172" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <rect x="128" y="179" width="16" height="16" rx="5" fill="#FF0000"/>
    <text x="152" y="190" fill="#EEEAF7">YouTube</text>
    <rect x="320" y="180" width="44" height="14" rx="7" fill="none" stroke="#A78BFA"/>
    <text x="342" y="190" fill="#E4DBFF" font-size="7" font-weight="800" text-anchor="middle">Release</text>
    <line x1="128" y1="202" x2="364" y2="202" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <rect x="128" y="209" width="16" height="16" rx="5" fill="#4285F4"/>
    <text x="152" y="220" fill="#EEEAF7">Maps</text>
    <rect x="320" y="210" width="44" height="14" rx="7" fill="#7C3AED"/>
    <text x="342" y="220" fill="#FFFFFF" font-size="7" font-weight="800" text-anchor="middle">Anchor</text>
  </g>
  <!-- base -->
  <path d="M70 256 H422 L408 270 Q404 274 398 274 H94 Q88 274 84 270 Z" fill="#2A2338"/>
  <rect x="220" y="256" width="52" height="5" rx="2.5" fill="#0D0A14" fill-opacity="0.6"/>

  <g transform="translate(-30 0)">
  <!-- ===== Phone with apps missing ===== -->
  <rect x="630" y="40" width="170" height="320" rx="28" fill="#1E1829" stroke="#3A3150"/>
  <rect x="641" y="52" width="148" height="296" rx="20" fill="#0D0A14"/>
  <rect x="697" y="58" width="36" height="8" rx="4" fill="#1E1829"/>
  <!-- status bar: Anchor's icon -->
  <text x="653" y="80" fill="#EEEAF7" fill-opacity="0.6" font-size="8" font-weight="700">9:41</text>
  <g transform="translate(768 72) scale(0.42)"><path fill="#B39DFF" d="M12,2A3,3 0 0,0 9,5C9,6.27 9.8,7.4 11,7.83V10H8V12H11V18.92C9.16,18.63 7.53,17.57 6.53,16H8V14H3V19H5V17.3C6.58,19.61 9.2,21 12,21C14.8,21 17.42,19.61 19,17.3V19H21V14H16V16H17.46C16.46,17.56 14.83,18.63 13,18.92V12H16V10H13V7.82C14.2,7.4 15,6.27 15,5A3,3 0 0,0 12,2M12,4A1,1 0 0,1 13,5A1,1 0 0,1 12,6A1,1 0 0,1 11,5A1,1 0 0,1 12,4Z"/></g>
  <!-- home screen: 4 x 4 apps; the anchored ones leave empty gaps -->
  <g>
    <rect x="655" y="98" width="26" height="26" rx="8" fill="#34A853"/>
    <rect x="688" y="98" width="26" height="26" rx="8" fill="#4285F4"/>
    <rect x="721" y="98" width="26" height="26" rx="8" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-dasharray="3 3"/>
    <rect x="754" y="98" width="26" height="26" rx="8" fill="#F9AB00"/>

    <rect x="655" y="138" width="26" height="26" rx="8" fill="#EA4335"/>
    <rect x="688" y="138" width="26" height="26" rx="8" fill="none" stroke="#8B5CF6" stroke-opacity="0.55" stroke-dasharray="3 3"/>
    <rect x="721" y="138" width="26" height="26" rx="8" fill="#25D366"/>
    <rect x="754" y="138" width="26" height="26" rx="8" fill="#5E6AD2"/>

    <rect x="655" y="178" width="26" height="26" rx="8" fill="#00A3E0"/>
    <rect x="688" y="178" width="26" height="26" rx="8" fill="#FF7A00"/>
    <rect x="721" y="178" width="26" height="26" rx="8" fill="#9AA0A6"/>
    <rect x="754" y="178" width="26" height="26" rx="8" fill="#FF4500"/>

    <rect x="655" y="218" width="26" height="26" rx="8" fill="#C13584"/>
    <rect x="688" y="218" width="26" height="26" rx="8" fill="#1DB954"/>
    <rect x="721" y="218" width="26" height="26" rx="8" fill="#0A84FF"/>
    <rect x="754" y="218" width="26" height="26" rx="8" fill="#FBBC04"/>

    <rect x="655" y="258" width="26" height="26" rx="8" fill="#6E56CF"/>
    <rect x="688" y="258" width="26" height="26" rx="8" fill="#E1306C"/>
    <rect x="721" y="258" width="26" height="26" rx="8" fill="#00897B"/>
    <rect x="754" y="258" width="26" height="26" rx="8" fill="#5F6368"/>
  </g>
  <!-- dock -->
  <rect x="651" y="300" width="128" height="36" rx="14" fill="#16121F"/>
  <rect x="657" y="306" width="24" height="24" rx="8" fill="#34A853"/>
  <rect x="688" y="306" width="24" height="24" rx="8" fill="#4285F4"/>
  <rect x="719" y="306" width="24" height="24" rx="8" fill="#EA4335"/>
  <rect x="750" y="306" width="24" height="24" rx="8" fill="#5F6368"/>

  </g>

  <!-- ===== USB cable ===== -->
  <path d="M422 262 C 520 262, 520 392, 640 392 C 660 392, 685 384, 685 366" fill="none" stroke="#8B7FA6" stroke-width="3" stroke-linecap="round"/>
  <rect x="408" y="254" width="16" height="16" rx="3" fill="#3A3150"/>
  <rect x="677" y="356" width="16" height="12" rx="3" fill="#3A3150"/>

  <!-- ===== Labels ===== -->
  <text x="246" y="312" fill="#EEEAF7" font-size="16" font-weight="800" text-anchor="middle">Your computer</text>
  <text x="246" y="334" fill="#EEEAF7" fill-opacity="0.6" font-size="13" text-anchor="middle">Linux or Windows. You pick the apps;</text>
  <text x="246" y="352" fill="#EEEAF7" fill-opacity="0.6" font-size="13" text-anchor="middle">it keeps the only key that releases them.</text>

  <text x="868" y="190" fill="#EEEAF7" font-size="16" font-weight="800" text-anchor="middle">Your phone</text>
  <text x="868" y="212" fill="#EEEAF7" fill-opacity="0.6" font-size="13" text-anchor="middle">Anchored apps</text>
  <text x="868" y="230" fill="#EEEAF7" fill-opacity="0.6" font-size="13" text-anchor="middle">are gone until the</text>
  <text x="868" y="248" fill="#EEEAF7" fill-opacity="0.6" font-size="13" text-anchor="middle">computer says so.</text>

  <rect x="452" y="310" width="122" height="28" rx="14" fill="#1E1829" stroke="#8B7FA6"/>
  <text x="513" y="329" fill="#E4DBFF" font-size="13" font-weight="700" text-anchor="middle">USB cable (adb)</text>
</svg>
